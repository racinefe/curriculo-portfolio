<section class="knowledge-section">
  <header class="section-header">
    <h2 class="section-title">Conhecimentos</h2>
    <p class="section-subtitle">Stack que uso nos projetos</p>
  </header>

  <ul class="skills-list">
    @for (item of arrayKnowledge(); track item.nome) {
      <li class="skill-item">
        <span class="skill-icon-wrap">
          <img
            [src]="item.src"
            [alt]="item.alt"
            loading="lazy"
            class="skill-icon"
          />
        </span>
        <span class="skill-name">{{ item.nome }}</span>
      </li>
    }
  </ul>
</section>
