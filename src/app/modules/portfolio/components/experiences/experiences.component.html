<section class="experiences-section">
  <header class="section-header">
    <h2 class="section-title">Experiências</h2>
  </header>

  <div class="timeline">
    @for (item of arrayExperiences(); track item.summary.strong; let i = $index) {
      <div class="timeline-item">
        <div class="timeline-marker">
          <div class="timeline-dot"></div>
          @if (i !== arrayExperiences().length - 1) {
            <div class="timeline-line"></div>
          }
        </div>

        <div class="timeline-content">
          <div class="experience-card" [class.active]="i === activeIndex">
            <button
              type="button"
              class="experience-header"
              (click)="toggleExperience(i)"
              [attr.aria-expanded]="i === activeIndex"
              [attr.aria-controls]="'experiencia-detalhe-' + i"
            >
              <span class="job-title">{{ item.summary.strong }}</span>
              <span class="job-meta">
                <span class="company">{{ item.summary.p.split('|')[0] }}</span>
                <span class="date">{{ item.summary.p.split('|')[1] }}</span>
              </span>
              <span class="toggle-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </span>
            </button>

            <div
              class="experience-details"
              [id]="'experiencia-detalhe-' + i"
              [attr.aria-hidden]="i !== activeIndex"
            >
              <div class="experience-text" [innerHTML]="item.text"></div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
